  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg-primary:#000;
      --bg-secondary:#0a0a0a;
      --bg-card:rgba(20,20,20,.85);
      --accent:#fff;
      --accent-dim:rgba(255,255,255,.08);
      --accent-glow:rgba(255,255,255,.18);
      --text-primary:#fff;
      --text-secondary:#e0e0e0;
      --text-muted:#999;
      --border-subtle:rgba(255,255,255,.09);
      --glass-bg:rgba(10,10,10,.65);
      --glass-border:rgba(255,255,255,.12);
      --font-sans:'Inter',sans-serif;
      --font-display:'Orbitron',sans-serif;
      --shadow-color:rgba(0,0,0,.6);
    }

    [data-theme="light"] {
      --bg-primary:#f5f5f5;
      --bg-secondary:#eee;
      --bg-card:rgba(255,255,255,.9);
      --accent:#000;
      --accent-dim:rgba(0,0,0,.06);
      --accent-glow:rgba(0,0,0,.13);
      --text-primary:#111;
      --text-secondary:#333;
      --text-muted:#666;
      --border-subtle:rgba(0,0,0,.1);
      --glass-bg:rgba(255,255,255,.75);
      --glass-border:rgba(0,0,0,.12);
      --shadow-color:rgba(0,0,0,.13);
    }

    html { scroll-behavior:smooth; scroll-padding-top:100px; }

    body {
      font-family:var(--font-sans);
      background:var(--bg-primary);
      color:var(--text-primary);
      line-height:1.7;
      overflow-x:hidden;
      transition:background .4s,color .3s;
    }

    a { color:inherit; text-decoration:none; }
    button { font-family:inherit; cursor:pointer; }
    img { max-width:100%; display:block; }

    .container {
      max-width:1200px;
      margin:auto;
      padding:0 24px;
      position:relative;
      z-index:2;
    }

    #particles-canvas {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      pointer-events:none;
    }

    /* ================= SITE HEADER ================= */

    .dx-site-header {
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:1000;
      padding:18px 0;
      background:var(--glass-bg);
      border-bottom:1px solid var(--border-subtle);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transition:background .3s,border-color .3s;
    }

    .dx-header-inner {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .dx-logo {
      font-family:var(--font-display);
      font-weight:800;
      font-size:18px;
      letter-spacing:2px;
      display:inline-flex;
      align-items:center;
      gap:9px;
    }

    .dx-logo i { font-size:15px; }

    .dx-nav {
      display:flex;
      align-items:center;
      gap:26px;
    }

    .dx-nav a {
      font-size:12px;
      font-weight:500;
      letter-spacing:1px;
      text-transform:uppercase;
      color:var(--text-secondary);
      transition:color .25s;
    }

    .dx-nav a:hover { color:var(--text-primary); }

    .dx-header-actions {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .dx-theme-toggle {
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:1px solid var(--glass-border);
      background:transparent;
      color:var(--text-primary);
      font-size:14px;
      transition:background .25s,transform .25s;
    }

    .dx-theme-toggle:hover {
      background:var(--accent-dim);
      transform:rotate(15deg);
    }

    .dx-header-cta {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 20px;
      border-radius:50px;
      background:var(--text-primary);
      color:var(--bg-primary);
      font-size:12px;
      font-weight:600;
      border:1px solid var(--text-primary);
      transition:background .3s,color .3s,transform .3s;
    }

    .dx-header-cta:hover {
      background:transparent;
      color:var(--text-primary);
      transform:translateY(-2px);
    }

    .dx-mobile-toggle {
      display:none;
      width:38px;
      height:38px;
      place-items:center;
      border-radius:8px;
      border:1px solid var(--glass-border);
      background:transparent;
      color:var(--text-primary);
      font-size:16px;
    }

    /* Mobile nav */
    @media(max-width:820px) {
      .dx-nav {
        position:fixed;
        top:74px;
        left:0;
        right:0;
        flex-direction:column;
        align-items:flex-start;
        gap:0;
        padding:12px 24px 20px;
        background:var(--bg-secondary);
        border-bottom:1px solid var(--border-subtle);
        transform:translateY(-140%);
        transition:transform .35s ease;
      }
      .dx-nav.open { transform:translateY(0); }
      .dx-nav a {
        width:100%;
        padding:13px 0;
        border-bottom:1px solid var(--border-subtle);
      }
      .dx-nav a:last-child { border-bottom:0; }
      .dx-mobile-toggle { display:grid; }
      .dx-header-cta { display:none; }
    }

    /* ================= HERO ================= */

    .dx-hero {
      min-height:90vh;
      display:flex;
      align-items:center;
      position:relative;
      overflow:hidden;
      padding:160px 0 100px;
      background:
        radial-gradient(ellipse at 80% 30%,rgba(255,255,255,.07),transparent 40%),
        radial-gradient(ellipse at 15% 75%,rgba(255,255,255,.045),transparent 38%),
        var(--bg-primary);
      border-bottom:1px solid var(--border-subtle);
    }

    .dx-hero-content { max-width:850px; }

    .dx-label {
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:7px 16px;
      border:1px solid var(--glass-border);
      border-radius:50px;
      background:var(--glass-bg);
      color:var(--text-secondary);
      font-family:var(--font-display);
      font-size:10px;
      letter-spacing:2px;
      margin-bottom:28px;
      backdrop-filter:blur(12px);
    }

    .dx-label i { font-size:11px; }

    .dx-hero h1 {
      font-family:var(--font-display);
      font-size:clamp(42px,8vw,86px);
      line-height:1.12;
      font-weight:800;
      letter-spacing:-2px;
      margin-bottom:22px;
    }

    .dx-hero h1 span {
      color:transparent;
      -webkit-text-stroke:1px var(--text-primary);
    }

    .dx-subtitle {
      font-family:var(--font-display);
      font-size:clamp(14px,2vw,20px);
      letter-spacing:1px;
      margin-bottom:18px;
    }

    .dx-description {
      max-width:630px;
      color:var(--text-secondary);
      font-size:15px;
      line-height:1.9;
    }

    .dx-actions {
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-top:32px;
    }

    .dx-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:13px 27px;
      border-radius:50px;
      border:1px solid var(--glass-border);
      font-size:13px;
      font-weight:600;
      transition:all .3s ease;
    }

    .dx-btn-primary {
      background:var(--text-primary);
      color:var(--bg-primary);
      border-color:var(--text-primary);
    }

    .dx-btn-primary:hover {
      background:transparent;
      color:var(--text-primary);
      transform:translateY(-3px);
    }

    .dx-btn-secondary {
      background:transparent;
      color:var(--text-primary);
    }

    .dx-btn-secondary:hover {
      background:var(--accent-dim);
      transform:translateY(-3px);
    }

    .dx-hero-meta {
      margin-top:55px;
      display:flex;
      flex-wrap:wrap;
      gap:28px;
      color:var(--text-muted);
      font-size:11px;
      letter-spacing:1px;
    }

    .dx-hero-meta i { margin-right:7px; }

    /* ================= SECTIONS ================= */

    .dx-section {
      padding:105px 0;
      position:relative;
      z-index:1;
    }

    .dx-heading {
      max-width:700px;
      margin-bottom:55px;
    }

    .dx-heading.center {
      text-align:center;
      margin-left:auto;
      margin-right:auto;
    }

    .dx-kicker {
      display:inline-block;
      padding:5px 14px;
      border:1px solid var(--glass-border);
      background:var(--accent-dim);
      border-radius:50px;
      font-family:var(--font-display);
      font-size:9px;
      letter-spacing:2px;
      margin-bottom:17px;
    }

    .dx-heading h2 {
      font-family:var(--font-display);
      font-size:clamp(27px,4vw,43px);
      line-height:1.25;
      margin-bottom:15px;
    }

    .dx-heading h2 span { opacity:.55; }

    .dx-heading p {
      color:var(--text-muted);
      font-size:14px;
    }

    /* SERVICE GRID */

    .dx-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .dx-card {
      position:relative;
      padding:30px;
      min-height:390px;
      display:flex;
      flex-direction:column;
      background:var(--bg-card);
      border:1px solid var(--border-subtle);
      border-radius:17px;
      overflow:hidden;
      transition:transform .35s,border-color .35s,box-shadow .35s;
      isolation:isolate;
    }

    .dx-card::before {
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:radial-gradient(circle at 90% 5%,rgba(255,255,255,.09),transparent 45%);
      opacity:0;
      transition:opacity .35s;
    }

    .dx-card:hover {
      transform:translateY(-7px);
      border-color:rgba(255,255,255,.4);
      box-shadow:0 20px 50px var(--shadow-color);
    }

    [data-theme="light"] .dx-card:hover {
      border-color:rgba(0,0,0,.35);
    }

    .dx-card:hover::before { opacity:1; }

    .dx-card-top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .dx-icon {
      width:58px;
      height:58px;
      display:grid;
      place-items:center;
      border:1px solid var(--glass-border);
      background:var(--accent-dim);
      border-radius:14px;
      font-size:23px;
      transition:transform .3s;
    }

    .dx-card:hover .dx-icon { transform:scale(1.08) rotate(-5deg); }

    .dx-number {
      font-family:var(--font-display);
      font-size:11px;
      color:var(--text-muted);
      letter-spacing:2px;
    }

    .dx-card h3 {
      font-family:var(--font-display);
      font-size:17px;
      line-height:1.5;
      margin-bottom:12px;
    }

    .dx-card p {
      color:var(--text-muted);
      font-size:13px;
      margin-bottom:20px;
    }

    .dx-features {
      list-style:none;
      margin-bottom:25px;
    }

    .dx-features li {
      color:var(--text-secondary);
      font-size:12px;
      padding:5px 0;
    }

    .dx-features li i {
      font-size:10px;
      margin-right:9px;
      color:var(--text-primary);
    }

    .dx-card-link {
      margin-top:auto;
      padding-top:17px;
      border-top:1px solid var(--border-subtle);
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:12px;
      font-weight:600;
      color:var(--text-primary);
      background:none;
      border-left:0;
      border-right:0;
      border-bottom:0;
      text-align:left;
    }

    .dx-card-link i { transition:transform .3s; }
    .dx-card-link:hover i { transform:translateX(6px); }

    /* PROCESS */

    .dx-process {
      background:var(--bg-secondary);
      border-top:1px solid var(--border-subtle);
      border-bottom:1px solid var(--border-subtle);
    }

    .dx-steps {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
    }

    .dx-step {
      padding:25px 20px;
      border:1px solid var(--border-subtle);
      border-radius:15px;
      background:var(--bg-card);
    }

    .dx-step-num {
      font-family:var(--font-display);
      font-size:28px;
      color:var(--text-muted);
      margin-bottom:20px;
    }

    .dx-step h3 {
      font-family:var(--font-display);
      font-size:14px;
      margin-bottom:10px;
    }

    .dx-step p { color:var(--text-muted); font-size:12px; }

    /* SHOWCASE */

    .dx-showcase {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .dx-demo {
      border:1px solid var(--border-subtle);
      border-radius:16px;
      background:var(--bg-card);
      overflow:hidden;
      transition:.3s;
    }

    .dx-demo:hover {
      transform:translateY(-5px);
      border-color:var(--text-muted);
    }

    .dx-demo-art {
      height:210px;
      display:grid;
      place-items:center;
      font-size:64px;
      background:
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.15),transparent 55%),
        linear-gradient(135deg,#191919,#050505);
      border-bottom:1px solid var(--border-subtle);
      position:relative;
      overflow:hidden;
    }

    .dx-demo-art::after {
      content:"";
      position:absolute;
      inset:0;
      background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(255,255,255,.025) 12px 13px);
    }

    .dx-demo-body { padding:23px; }

    .dx-demo-tag {
      font-size:9px;
      letter-spacing:2px;
      color:var(--text-muted);
      font-family:var(--font-display);
    }

    .dx-demo h3 {
      font-family:var(--font-display);
      font-size:16px;
      margin:10px 0;
    }

    .dx-demo p { font-size:12px; color:var(--text-muted); }

    /* WHY US */

    .dx-why {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    .dx-why-item {
      padding:24px;
      border:1px solid var(--border-subtle);
      border-radius:14px;
      background:var(--bg-card);
    }

    .dx-why-item i {
      font-size:20px;
      margin-bottom:15px;
    }

    .dx-why-item h3 {
      font-family:var(--font-display);
      font-size:13px;
      margin-bottom:8px;
    }

    .dx-why-item p { color:var(--text-muted); font-size:12px; }

    /* PRICING */

    .dx-pricing {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .dx-price-card {
      padding:30px;
      border:1px solid var(--border-subtle);
      border-radius:16px;
      background:var(--bg-card);
    }

    .dx-price-card.featured { border-color:var(--text-primary); }

    .dx-price-card h3 {
      font-family:var(--font-display);
      font-size:17px;
      margin:12px 0;
    }

    .dx-price-card p { font-size:12px; color:var(--text-muted); }

    .dx-price {
      font-family:var(--font-display);
      font-size:17px;
      margin:25px 0;
    }

    /* CTA */

    .dx-cta {
      padding:75px 30px;
      text-align:center;
      border:1px solid var(--glass-border);
      border-radius:20px;
      background:
        radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.10),transparent 65%),
        var(--bg-card);
    }

    .dx-cta h2 {
      font-family:var(--font-display);
      font-size:clamp(27px,4vw,43px);
      margin-bottom:15px;
    }

    .dx-cta p {
      max-width:600px;
      margin:0 auto 28px;
      color:var(--text-muted);
      font-size:13px;
    }

    /* FORM */

    .dx-form {
      max-width:750px;
      margin:auto;
      padding:32px;
      background:var(--bg-card);
      border:1px solid var(--border-subtle);
      border-radius:18px;
    }

    .dx-form-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:17px;
    }

    .dx-field { margin-bottom:18px; }

    .dx-field label {
      display:block;
      font-size:12px;
      font-weight:600;
      margin-bottom:8px;
    }

    .dx-field input,.dx-field select,.dx-field textarea {
      width:100%;
      padding:13px 14px;
      border:1px solid var(--border-subtle);
      background:var(--bg-secondary);
      color:var(--text-primary);
      border-radius:9px;
      font:13px var(--font-sans);
      outline:none;
    }

    .dx-field input:focus,.dx-field select:focus,.dx-field textarea:focus {
      border-color:var(--text-muted);
    }

    .dx-field textarea { min-height:120px; resize:vertical; }

    .dx-note { color:var(--text-muted); font-size:11px; margin-top:15px; }

    /* MODAL */

    .dx-modal {
      display:none;
      position:fixed;
      inset:0;
      z-index:2000;
      background:rgba(0,0,0,.85);
      backdrop-filter:blur(12px);
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .dx-modal.open { display:flex; }

    .dx-modal-box {
      position:relative;
      width:min(480px,100%);
      padding:35px;
      border:1px solid var(--glass-border);
      border-radius:18px;
      background:#111;
      color:white;
      text-align:center;
    }

    .dx-modal-box h3 {
      font-family:var(--font-display);
      margin-bottom:15px;
    }

    .dx-modal-box p { font-size:13px; color:#aaa; }

    .dx-modal-close {
      position:absolute;
      top:12px;
      right:17px;
      color:white;
      border:0;
      background:none;
      font-size:25px;
    }

    /* ================= SITE FOOTER ================= */

    .dx-footer-site {
      position:relative;
      z-index:2;
      padding:65px 0 0;
      border-top:1px solid var(--border-subtle);
      background:var(--bg-secondary);
      margin-top:0;
    }

    .dx-footer-grid {
      display:grid;
      grid-template-columns:1.6fr 1fr 1fr 1fr;
      gap:40px;
      padding-bottom:50px;
    }

    .dx-footer-brand .dx-logo { margin-bottom:16px; }

    .dx-footer-brand p {
      color:var(--text-muted);
      font-size:12px;
      max-width:300px;
      line-height:1.8;
    }

    .dx-footer-social {
      display:flex;
      gap:10px;
      margin-top:18px;
    }

    .dx-footer-social a {
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border:1px solid var(--border-subtle);
      border-radius:50%;
      font-size:13px;
      color:var(--text-secondary);
      transition:background .25s,color .25s,transform .25s;
    }

    .dx-footer-social a:hover {
      background:var(--text-primary);
      color:var(--bg-primary);
      transform:translateY(-3px);
    }

    .dx-footer-col h4 {
      font-family:var(--font-display);
      font-size:11px;
      letter-spacing:2px;
      margin-bottom:18px;
      color:var(--text-primary);
    }

    .dx-footer-col ul { list-style:none; }

    .dx-footer-col li { margin-bottom:11px; }

    .dx-footer-col a {
      font-size:12px;
      color:var(--text-muted);
      transition:color .25s;
    }

    .dx-footer-c
